  async join(roomCode, isHost) {
    if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith("PASTE_")) {
      throw new Error("Firebase sozlanmagan. SETUP_UZ.txt faylidagi ko‘rsatma bo‘yicha Firebase config kiriting.");
    }
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    const cred = await auth.signInAnonymously();
    this.authUser = cred.user;
    this.db = firebase.database();
    this.roomRef = this.db.ref("f1GrandPrixRooms/" + roomCode);
    const snap = await this.roomRef.child("meta").once("value");
    if (isHost && snap.exists()) throw new Error("Bu xona kodi band. Yana urinib ko‘ring.");
    if (!isHost && !snap.exists()) throw new Error("Bunday xona topilmadi. Kodni tekshiring.");
    if (isHost) await this.roomRef.child("meta").set({ createdAt: firebase.database.ServerValue.TIMESTAMP, hostUid: cred.user.uid });
    this.peerId = cred.user.uid;
    this.playerRef = this.roomRef.child("players").child(this.peerId);
    await this.playerRef.onDisconnect().remove();
    const self = this;
    return {
      async presence(data) {
        if (!self.playerRef) return;
        await self.playerRef.update(data);
      },
      onPeers(callback) {
        const ref = self.roomRef.child("players");
        const handler = ref.on("value", snap => {
          const peers = [];
          snap.forEach(child => {
            const presence = child.val() || {};
            peers.push({
              peer: child.key,
              presence,
              kind: "viewer",
              isMe: child.key === self.peerId
            });
          });
          callback({ peers });
        });
        return () => ref.off("value", handler);
      },
      async leave() {
        if (self.playerRef) {
          try { await self.playerRef.remove(); } catch (_) {}
        }
        self.playerRef = null;
        self.roomRef = null;
        self.peerId = null;
      }
    };
  }
};

addEventListener('keyup',e=>{const k=km[e.key];if(k)key[k]=0});
// ---- holat
let mode='menu',room=null,gr=null,unP=null,isHost=false,humans=[],T0=0,p=null,me=null,bots=[],peerCars={},sendT=0,shake=0,running=false,LT=LAPS,Q=null,myNick='';
let raceConfig={laps:10,weather:'dry',tyre:'medium',drs:'on',damage:'on'};
function readConfig(){return {laps:Number($('cfgLaps').value)||10,weather:$('cfgWeather').value,tyre:$('cfgTyre').value,drs:$('cfgDRS').value,damage:$('cfgDamage').value}}
function showConfig(c){if(!c)return;raceConfig={...raceConfig,...c};$('cfgLaps').value=String(raceConfig.laps);$('cfgWeather').value=raceConfig.weather;$('cfgTyre').value=raceConfig.tyre;$('cfgDRS').value=raceConfig.drs;$('cfgDamage').value=raceConfig.damage}
function publishConfig(){if(!isHost||!gr)return;raceConfig=readConfig();gr.presence({cfgLaps:raceConfig.laps,cfgWeather:raceConfig.weather,cfgTyre:raceConfig.tyre,cfgDRS:raceConfig.drs,cfgDamage:raceConfig.damage}).catch(()=>{})}
function configFromPresence(pr){if(pr&&pr.cfgLaps)return {laps:Number(pr.cfgLaps)||10,weather:pr.cfgWeather||'dry',tyre:pr.cfgTyre||'medium',drs:pr.cfgDRS||'on',damage:pr.cfgDamage||'on'};return null}
function lockConfig(locked){['cfgLaps','cfgWeather','cfgTyre','cfgDRS','cfgDamage'].forEach(id=>$(id).disabled=locked);$('cfgHint').textContent=locked?'Sozlamalarni faqat xona egasi o‘zgartiradi.':'Sozlamalar barcha haydovchilarga yuboriladi.'}
const gridOf=s=>({f:-(10+(s>>1)*9)/DS,lat:(s&1?3.5:-3.5)}),fm=t=>t>=1e8?'—':Math.floor(t/60)+':'+(t%60).toFixed(2).padStart(5,'0');
function botTable(s){const f=.86+.14*((s*7%20)/19),T=[0];for(let i=0;i<N;i++)T.push(T[i]+DS/(72*f/(1+60*CU[i])));return T}
const BQ={};function botQ(j){if(!BQ[j]){const T=botTable(j);BQ[j]=T[N]+2.5+((j*13%10)-5)*.12}return BQ[j]}
function botTot(b,t){const tt=t<0?0:(t<5?t*t/10:t-2.5),Tl=b.T[N],ln=Math.floor(tt/Tl),r=tt-ln*Tl;let lo=0,hi=N;while(hi-lo>1){const m=(lo+hi)>>1;if(b.T[m]<=r)lo=m;else hi=m}
 return ln*N+lo+(r-b.T[lo])/(b.T[lo+1]-b.T[lo])-(10+(b.slot>>1)*9)/DS}
const HS=()=>gr?humans:[{isMe:true,peer:'me',presence:{nick:myNick}}];
const driverName=h=>String((h&&h.presence&&h.presence.nick)||(h&&h.isMe?myNick:'Haydovchi')).slice(0,16)||'Haydovchi';
function qOrder(){const hs=HS(),a=hs.map(h=>({h:1,isMe:h.isMe,peer:h.peer,bt:h.isMe?Q.bt:(Number(h.presence.bt)||1e9)}));for(let j=0;j<TOT-hs.length;j++)a.push({h:0,id:j,bt:botQ(j)});return a.sort((x,y)=>x.bt-y.bt)}
function qActive(){const hs=HS();return Q.list.find(id=>{const h=hs.find(x=>x.peer===id);return h&&!(h.isMe?Q.done:Number(h.presence.qd)===1)})}
function clearCars(){if(me)scene.remove(me);bots.forEach(b=>scene.remove(b.g));Object.values(peerCars).forEach(c=>scene.remove(c.g));me=null;bots=[];peerCars={}}
function mkP(f,lap,lt){const q=TP(f);return{x:q.x+Math.cos(q.h)*lt,z:q.z+Math.sin(q.h)*lt,yaw:q.h,v:0,i:((Math.round(f)%N)+N)%N,lap,lat:lt,tot:f,fin:0,inv:0,slot:0,wear:0,gear:1}}
function camBack(){cam.position.set(p.x-Math.sin(p.yaw)*9,3.4,p.z+Math.cos(p.yaw)*9)}
function startQual(){if(mode!=='menu')return;mode='qual';LT=1;clearCars();$('ov').style.display='none';const hs=HS();
 Q={list:hs.map(h=>h.peer),bt:1e9,att:0,done:0,on:0,nextAt:Date.now()+2500,rg:0,ql:0,last:1e9};
 hs.forEach((h,i)=>{if(h.isMe){me=makeCar(COLS[i%20]);scene.add(me)}else{const c={g:makeCar(COLS[i%20]),tot:0,tx:0,tz:0,ty:0,init:0};c.g.visible=false;scene.add(c.g);peerCars[h.peer]=c}});
 p=mkP(-3/DS,-1,0);p.fin=1;ang=0;camBack();running=true}
function beginAttempt(){Q.on=1;p=mkP(-3/DS,-1,0);T0=Date.now()+3500;ang=0;camBack()}
function qFin(t){Q.att++;Q.last=t;if(t<Q.bt)Q.bt=t;Q.on=0;Q.nextAt=Date.now()+3000;const pr={qa:Q.att};if(Q.bt<1e8)pr.bt=+Q.bt.toFixed(2);if(Q.att>=2){Q.done=1;pr.qd=1}gr&&gr.presence(pr).catch(()=>{})}
function qList(){const o=qOrder(),hs=HS(),el=$('ql');el.textContent='';o.forEach((e,i)=>{if(i<8||e.isMe){const d=document.createElement('div');const h=e.h?hs.find(x=>x.peer===e.peer):null;d.textContent=(i+1)+'. '+(e.h?driverName(h)+(e.isMe?' (siz)':''):'Bot '+(e.id+1))+'  '+fm(e.bt);el.appendChild(d)}})}
function peerUpd(){Object.values(peerCars).forEach(c=>{if(!c.init)return;c.g.position.x+=(c.tx-c.g.position.x)*.25;c.g.position.z+=(c.tz-c.g.position.z)*.25;c.g.rotation.y=-c.ty})}
function qStep(dt){const a=qActive(),my=HS().find(h=>h.isMe).peer;for(const id in peerCars)peerCars[id].g.visible=(id===a);peerUpd();
 Q.ql-=dt;if(Q.ql<=0){Q.ql=.5;qList()}
 if(a===undefined){if(!Q.rg&&(!gr||isHost)){Q.rg=1;const rg=Date.now()+8000;gr&&gr.presence({rg}).catch(()=>{});startRace(rg,qOrder())}return}
 if(a===my){if(Q.on)step(dt);else if(Date.now()>=Q.nextAt)beginAttempt()}}
function startRace(t0,order){if(mode==='race')return;mode='race';LAPS=Number(raceConfig.laps)||10;LT=LAPS;T0=t0;clearCars();$('ov').style.display='none';$('ql').textContent='';
 const mi=Math.max(0,order.findIndex(e=>e.isMe)),g=gridOf(mi);p=mkP(g.f,-1,g.lat);p.slot=mi;me=makeCar(COLS[mi%20]);scene.add(me);ang=0;camBack();
 order.forEach((e,i)=>{if(e.isMe)return;if(e.h){const gg=gridOf(i),q=TP(gg.f),c={g:makeCar(COLS[i%20]),tot:gg.f,tx:q.x+Math.cos(q.h)*gg.lat,tz:q.z+Math.sin(q.h)*gg.lat,ty:q.h,init:1};c.g.position.set(c.tx,0,c.tz);scene.add(c.g);peerCars[e.peer]=c}
  else{const b={id:e.id,slot:i,T:botTable(e.id),g:makeCar(COLS[i%20]),tot:0};scene.add(b.g);bots.push(b)}});
 running=true}
function place(){let n=1;bots.forEach(b=>{if(b.tot>p.tot)n++});Object.values(peerCars).forEach(c=>{if(c.tot>p.tot)n++});return n}
function step(dt){const t=(Date.now()-T0)/1000;
 if(t>=0&&!p.fin){const gas=key.G,br=key.B,off=Math.abs(p.lat)>13.2;
  const weatherGrip=raceConfig.weather==='wet'?.68:raceConfig.weather==='light'?.84:1;
  const tyreGrip=raceConfig.tyre==='soft'?1.04:raceConfig.tyre==='hard'?.94:1;
  const wearGrip=Math.max(.72,1-p.wear*.0028)*weatherGrip*tyreGrip,speedGrip=1-.24*Math.min(p.v/95,1);
  const aeroDrag=.0019*p.v*p.v,rolling=1.05+p.v*.035;
  if(gas)p.v+=Math.max(0,30-aeroDrag)*dt;else p.v-=rolling*dt;
  if(br)p.v-=58*dt;if(off&&p.v>18){p.v-=Math.min(48,p.v*.72)*dt;p.wear=Math.min(100,p.wear+dt*(raceConfig.tyre==='soft'?2.2:raceConfig.tyre==='hard'?1.0:1.5)*(raceConfig.weather==='wet'?1.15:1))}
  if(gas&&Math.abs(ang)>48&&p.v>45)p.wear=Math.min(100,p.wear+dt*(raceConfig.tyre==='soft'?.18:raceConfig.tyre==='hard'?.07:.12));
  p.v=Math.max(0,Math.min(95,p.v));
  if(!drag)ang+=((key.R-key.L)*110-ang)*Math.min(1,7*dt);
  const steerGrip=wearGrip*speedGrip;p.yaw+=ang/110*Math.min(1,p.v/15)*(1.28-.78*Math.min(p.v/95,1))*steerGrip*dt;
  p.gear=Math.max(1,Math.min(8,Math.floor(p.v/12)+1))}
 else if(p.fin){p.v=Math.max(0,p.v-16*dt)}
 p.x+=Math.sin(p.yaw)*p.v*dt;p.z-=Math.cos(p.yaw)*p.v*dt;if(p.inv>0)p.inv-=dt;
 let b=1e12,bi=p.i;for(let k=-10;k<=20;k++){const i=(p.i+k+N)%N,dx=p.x-TX[i],dz=p.z-TZ[i],d=dx*dx+dz*dz;if(d<b){b=d;bi=i}}
 if(p.i>N*.75&&bi<N*.25)p.lap++;else if(p.i<N*.25&&bi>N*.75)p.lap--;
 p.i=bi;const h=TH[bi],ddx=p.x-TX[bi],ddz=p.z-TZ[bi];p.lat=ddx*Math.cos(h)+ddz*Math.sin(h);p.tot=p.lap*N+bi+(ddx*Math.sin(h)-ddz*Math.cos(h))/DS;
 bots.forEach(o=>{o.tot=botTot(o,t);const q=TP(o.tot),lt=(o.slot&1?3.5:-3.5)+Math.sin(o.tot*.02+o.slot)*2.5;o.g.position.set(q.x+Math.cos(q.h)*lt,0,q.z+Math.sin(q.h)*lt);o.g.rotation.y=-q.h;
  if(raceConfig.damage==='on'&&p.inv<=0&&Math.hypot(o.g.position.x-p.x,o.g.position.z-p.z)<3.2){p.v*=.88;p.inv=.5;shake=.3}});
 peerUpd();
 if(gr&&(sendT-=dt)<=0){sendT=.1;gr.presence({x:+p.x.toFixed(1),z:+p.z.toFixed(1),y:+p.yaw.toFixed(3),t:+p.tot.toFixed(2)}).catch(()=>{})}
 if(mode==='qual'){if(!p.fin&&p.lap>=1){p.fin=1;qFin(t)}else if(!p.fin&&t>120){p.fin=1;qFin(1e9)}return}
 if(!p.fin&&p.lap>=LT){p.fin=1;const n=place();$('t').textContent=n+'-o‘rin!';$('m').textContent=n===1?'Siz g‘olibsiz! Vaqt: '+t.toFixed(1)+' s':'Poyga tugadi. Vaqt: '+t.toFixed(1)+' s';
  setTimeout(()=>{if(mode!=='race')return;showMenu()},2500)}}
function render(dt){if(!p)return;let V=p,qmsg='';const t=(Date.now()-T0)/1000;
 if(mode==='qual'){const a=qActive(),my=HS().find(h=>h.isMe).peer,c=peerCars[a];
  if(a===undefined)qmsg='Qualify tugadi! Start gridi tuzilmoqda...';
  else if(a===my)qmsg=Q.on?(t<0?'Sizning navbatingiz! Tayyor bo‘ling':(Q.att+1)+'-urinish (jami 2 ta)'):(Q.att>0?Q.att+'-urinish: '+fm(Q.last)+' · keyingisiga tayyor bo‘ling':'Sizning navbatingiz...');
  else{V=c&&c.init?{x:c.g.position.x,z:c.g.position.z,yaw:c.ty,v:0}:{x:TX[0],z:TZ[0],yaw:TH[0],v:0};qmsg=driverName(HS().find(h=>h.peer===a))+' aylanmoqda'+(Q.att?' · sizning eng yaxshi vaqtingiz: '+fm(Q.bt):'')}}
 else if(mode==='race'&&t<-3)qmsg='Start gridi: siz '+(p.slot+1)+'-o‘rindan startlaysiz';
 $('qm').textContent=qmsg;
 me.position.set(p.x,0,p.z);me.rotation.y=-p.yaw;me.visible=(mode==='race'||(mode==='qual'&&V===p&&!Q.done))&&(p.inv<=0||Math.floor(p.inv*14)%2===0);
 const tx=V.x-Math.sin(V.yaw)*9,tz=V.z+Math.cos(V.yaw)*9,k=1-Math.exp(-12*dt);cam.position.x+=(tx-cam.position.x)*k;cam.position.z+=(tz-cam.position.z)*k;cam.position.y=3.4;
 if(shake>0){shake-=dt;cam.position.x+=(Math.random()-.5)*.5}
 cam.fov=62+V.v*.25;cam.updateProjectionMatrix();cam.lookAt(V.x+Math.sin(V.yaw)*14,1.2,V.z-Math.cos(V.yaw)*14);
 ground.position.set(V.x,0,V.z);wh.firstElementChild.style.transform='rotate('+ang+'deg)';
 const q=mode==='qual',mine=V===p&&(!q||Q.on);
 $('sp').firstChild.nodeValue=Math.round(V.v*3.6);$('lp').textContent=q?'Qualify '+Math.min(2,Q.att+1)+'/2':Math.max(1,Math.min(LAPS,p.lap+1))+'/'+LAPS+' aylana';
 $('tm').textContent=(mine?Math.max(0,t):0).toFixed(1)+' s';$('ps').textContent=q?'–':place();
 $('cd').textContent=mine?(t<-3?'':t<0?Math.ceil(-t):t<1?'GO!':''):'';
 const lamps=[...$('startLights').children];const lit=mode==='race'&&t<0?Math.min(5,Math.max(0,Math.floor((t+3.0)/.55)+1)):0;lamps.forEach((l,i)=>l.classList.toggle('on',i<lit));$('startLights').style.display=(mode==='race'&&t>-3.4&&t<1.2)?'flex':'none';$('gear').textContent=mine?(p.gear||1):'—';$('tyre').textContent=mine?(p.wear>65?'WORN':p.wear>30?'USED':'SOFT'):'—';$('drs').textContent=mine&&raceConfig.drs==='on'&&p.v>55?'READY':'OFF';$('tyre').textContent=mine?(raceConfig.tyre.toUpperCase()+' '+(p.wear>65?'WORN':p.wear>30?'USED':'NEW')):'—';
 R.render(scene,cam)}
// ---- menyu va xona
function showMenu(){leave();mode='menu';running=false;Q=null;$('ov').style.display='flex';$('mn').style.display=$('mr').style.display=$('mj').style.display='';$('lb').style.display='none';$('cd').textContent=$('qm').textContent='';$('ql').textContent='';
 if(!(p&&p.fin)){$('t').textContent='F1 Poyga';$('m').textContent='Nik kiriting, keyin qualify: har bir haydovchiga 2 ta urinish. Eng tez vaqt birinchi start oladi.'}}
function leave(){try{unP&&unP()}catch(e){}unP=null;if(gr){try{gr.leave()}catch(e){}}gr=null;if(room&&room.playerRef){try{room.playerRef.remove()}catch(e){}}room=null;isHost=false;humans=[]}
const mkCode=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.random()*a.length|0];return s};
async function openRoom(code,host){
 try{
  room=window.F1Online;
  gr=await room.join('f1'+code.toLowerCase(),host);
  isHost=host;
  await gr.presence({in:1,h:host?1:0,nick:myNick,cfgLaps:raceConfig.laps,cfgWeather:raceConfig.weather,cfgTyre:raceConfig.tyre,cfgDRS:raceConfig.drs,cfgDamage:raceConfig.damage});
  $('mn').style.display=$('mr').style.display=$('mj').style.display='none';
  $('lb').style.display='';
  $('cdz').textContent=code;
  $('bg').style.display=host?'':'none';
  lockConfig(!host);
  showConfig(raceConfig);
  $('t').textContent='Xona';
  $('m').textContent=host?'Xona yaratildi! Kodni do‘stlaringizga yuboring. Hamma kirgach START bosing.':'Xonaga qo‘shildingiz. Host boshlashini kuting...';
  unP=gr.onPeers(onPeers);
 }catch(e){
  leave();
  showMenu();
  $('m').textContent=(e&&e.message)||'Xonaga ulanib bo‘lmadi. Internet va Firebase sozlamalarini tekshiring.';
 }}
function peersUpd(){humans.forEach(h=>{const c=peerCars[h.peer];if(!c||h.isMe)return;const q=h.presence;if(q.x===undefined)return;c.tx=Number(q.x)||0;c.tz=Number(q.z)||0;c.ty=Number(q.y)||0;c.tot=Number(q.t)||0;if(!c.init){c.init=1;c.g.position.set(c.tx,0,c.tz)}})}
function onPeers(ch){const all=ch.peers.filter(x=>x.presence&&x.presence.in&&x.kind==='viewer');
 humans=all.sort((a,b)=>(b.presence.h?1:0)-(a.presence.h?1:0)||(a.peer<b.peer?-1:1)).slice(0,TOT);
 if(mode==='menu'&&gr){const hostPeer=all.find(h=>h.presence.h);if(hostPeer){const incoming=configFromPresence(hostPeer.presence);if(incoming){showConfig(incoming);if(!isHost)lockConfig(true)}}$('pl').textContent='';humans.forEach((h,i)=>{const d=document.createElement('div');d.textContent=(i+1)+'. '+driverName(h)+(h.isMe?' (siz)':'')+(h.presence.h?' · host':'');$('pl').appendChild(d)});
  const hs=humans.find(h=>h.presence.h&&Number(h.presence.go)>0);if(hs&&Date.now()<Number(hs.presence.go)+20000)startQual()}
 else if(mode==='qual'){const hs=humans.find(h=>h.presence.h&&Number(h.presence.rg)>0);if(hs&&!Q.rg){Q.rg=1;startRace(Number(hs.presence.rg),qOrder())}else peersUpd()}
 else if(mode==='race')peersUpd()}
$('bs').onclick=()=>{myNick=$('nick').value.trim().slice(0,16);if(!myNick){$('m').textContent='Avval o‘z nikingizni kiriting.';$('nick').focus();return}leave();startQual()};
$('bo').onclick=()=>{myNick=$('nick').value.trim().slice(0,16);if(!myNick){$('m').textContent='Avval o‘z nikingizni kiriting.';$('nick').focus();return}openRoom(mkCode(),true)};
$('bj').onclick=()=>{myNick=$('nick').value.trim().slice(0,16);if(!myNick){$('m').textContent='Avval o‘z nikingizni kiriting.';$('nick').focus();return}const c=$('ci').value.trim().toUpperCase();if(c.length===4)openRoom(c,false);else $('m').textContent='4 belgili kodni kiriting.'};
['cfgLaps','cfgWeather','cfgTyre','cfgDRS','cfgDamage'].forEach(id=>$(id).addEventListener('change',publishConfig));
$('bg').onclick=()=>{if(isHost){raceConfig=readConfig();gr&&gr.presence({go:Date.now(),cfgLaps:raceConfig.laps,cfgWeather:raceConfig.weather,cfgTyre:raceConfig.tyre,cfgDRS:raceConfig.drs,cfgDamage:raceConfig.damage}).catch(()=>{})}startQual()};
$('bx').onclick=()=>showMenu();
$('startLights').style.display='none';let last=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;if(running){if(mode==='qual')qStep(dt);else step(dt)}render(dt)}
requestAnimationFrame(loop);
</script>
